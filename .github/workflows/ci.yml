name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      # SaltUI 的 desktop 产物是 Java 21 字节码，运行时必须 21+
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 运行测试
        shell: bash
        run: ./gradlew :shared:jvmTest --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  desktop:
    name: 桌面版 / 打包 jar
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 打包免安装 jar
        run: ./gradlew :desktopApp:fatJar --console=plain

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseTagger-jar
          path: desktopApp/build/libs/NeteaseTagger.jar
          if-no-files-found: error

  android:
    name: Android / 打包 APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 加了这个 action 后会写入 ANDROID_HOME，
      # settings.gradle.kts 靠它判断是否纳入 :androidApp 模块
      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 打包 debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseTagger-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS / 编译 Kotlin framework
    runs-on: macos-latest
    # iOS 代码在本仓库从未于 macOS 上编译过，首次跑可能暴露问题。
    # 设成 advisory 只是为了避免阻塞其他平台；修好后应去掉 continue-on-error。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
