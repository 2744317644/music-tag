# XcodeGen 配置：在 macOS 上执行 `xcodegen generate` 生成 iosApp.xcodeproj
#
# 前置：
#   1. macOS + Xcode 15+
#   2. brew install xcodegen
#   3. framework 由下面的 preBuildScript 自动构建，无需手动执行
name: iosApp

options:
  bundleIdPrefix: app.musictag
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Gradle 需要在 preBuild 脚本里跑，必须关掉沙箱
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.musictag.ios
        PRODUCT_NAME: MusicTag
        # Kotlin framework 搜索路径：真机与模拟器都放上，按 sdk 自动命中
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        OTHER_LDFLAGS:
          - "-framework"
          - "Shared"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"

    preBuildScripts:
      - name: "Build shared Kotlin framework"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          else
            ./gradlew :shared:linkDebugFrameworkIosArm64
          fi
