name: Release

# 打 tag（例如 v1.0.0）时自动构建三端安装包并发布。
# 手动触发（workflow_dispatch）只构建、上传 artifact，不创建 Release —— 用于验证流水线。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows / exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # jpackage 出 exe 需要 WiX。先 choco 装，装不上交给 Compose 插件自己下载。
      - name: 安装 WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset --no-progress -y

      - name: 打包 exe 安装包
        shell: bash
        run: ./gradlew :desktopApp:packageExe --console=plain

      - name: 打包便携版（app-image）
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --console=plain

      - name: 收集 Windows 产物
        shell: bash
        run: |
          mkdir -p release
          cp desktopApp/build/compose/binaries/main/exe/*.exe release/ 2>/dev/null || true
          (cd desktopApp/build/compose/binaries/main/app && 7z a -tzip "$GITHUB_WORKSPACE/release/music-tag-windows-x64-portable.zip" music-tag)
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*
          if-no-files-found: error

  android:
    name: Android / apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 未提供签名密钥时，androidApp/build.gradle.kts 会回退到 debug 签名，
      # 所以这里总能产出**可安装**的 APK；要正式签名请配置下面四个 Secrets：
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 打包 release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          ./gradlew :androidApp:assembleRelease --console=plain

      - name: 收集 APK
        run: |
          mkdir -p out
          find androidApp/build/outputs/apk/release -name "*.apk" -exec cp {} out/music-tag.apk \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: out/music-tag.apk
          if-no-files-found: error

  ios:
    name: iOS / ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # 未签名构建：不依赖 Apple 开发者账号。产出的 ipa 需要自行签名才能装机。
      - name: 编译并打包未签名 ipa
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            | tail -60
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry music-tag-unsigned.ipa Payload
          ls -lh music-tag-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: iosApp/music-tag-unsigned.ipa
          if-no-files-found: error

  publish:
    name: 发布
    runs-on: ubuntu-latest
    needs: [ windows, android, ios ]
    # 只有打 tag 才发布；手动触发只验构建
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 收集全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 用 tag 名重命名
        run: |
          cd dist && ls -l
          VER="${GITHUB_REF_NAME}"
          [ -f music-tag.apk ] && mv music-tag.apk "music-tag-${VER}.apk" || true
          [ -f music-tag-unsigned.ipa ] && mv music-tag-unsigned.ipa "music-tag-${VER}-unsigned.ipa" || true
          ls -l

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 下载哪个

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `*.exe` | 安装版（自带 JDK 21 运行时） |
            | Windows | `music-tag-windows-x64-portable.zip` | 免安装，解压后双击 `music-tag.exe` |
            | Android | `music-tag-*.apk` | 直接安装（Android 7.0+ / minSdk 24） |
            | iOS | `music-tag-*-unsigned.ipa` | **未签名**，需自行签名后才能装 |

            iOS 无法提供可直接安装的 ipa：iOS 要求 Apple 开发者证书签名。
            开源项目通常只发布未签名包，由使用者用自己账号签名（Sideloadly / AltStore）。

            APK 默认用 debug 密钥签名（可直接安装，但不能上架应用商店）。
            需要正式签名请自行配置四个 Secrets，见仓库 `.github/workflows/release.yml`。

            详见 [README](https://github.com/${{ github.repository }}#readme)。
